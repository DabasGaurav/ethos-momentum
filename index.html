<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Momentum Rules Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f3f1;--card:#fff;--fg:#1b1f1d;--mut:#66726d;--line:#e3e5e1;--rail:#0e4a3d;--acc:#0e4a3d;--acc2:#e3eeea;--red:#b0392c;--redbg:#fbebe8;--amb:#9a6200;--ambbg:#fcf1dc;--grn:#1b7448;--grnbg:#e2f3e9;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 "Public Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);padding:22px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{padding:0 10px 18px;font:600 20px "Source Serif 4",Georgia,serif;color:#fff}
.rail a{color:#dfeee9;text-decoration:none;padding:8px 10px;border-radius:6px;font-size:14px}
.rail a:hover{background:#165c4c}.rail a.on{background:var(--acc2);color:var(--rail);font-weight:600}
.rail .gap{height:12px}
.main{min-width:0;padding-block:40px 60px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media(max-width:820px){.app{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px))}.brand,.rail .gap{display:none}.rail a{white-space:nowrap;flex:none}.main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
h1{font:600 36px/1.15 "Source Serif 4",Georgia,serif;margin:0;text-wrap:balance}
h2{font:600 28px/1.2 "Source Serif 4",Georgia,serif;margin:0;text-wrap:balance}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.sub{color:var(--mut);margin:0;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){.cols,.three{grid-template-columns:1fr}}
.quote{border-left:3px solid var(--acc);padding-left:12px;color:var(--mut)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 16px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.nav{display:flex;justify-content:space-between}
.tag{display:inline-block;font:500 13px "IBM Plex Mono",monospace;padding:3px 10px;border-radius:6px}
.big{font-size:20px;padding:5px 14px}
.t-Full{background:var(--grnbg);color:var(--grn)}.t-Capped{background:var(--ambbg);color:var(--amb)}.t-As-paid{background:var(--redbg);color:var(--red)}
.tier{border-radius:12px;padding:16px}.tier b{font:500 13px "IBM Plex Mono",monospace;letter-spacing:.05em}.tier p{margin:6px 0 0;font-size:14px}
.tier.f{background:var(--grnbg)}.tier.c{background:var(--ambbg)}.tier.a{background:var(--redbg)}
.steps{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.st:last-child{border-bottom:0}
.n{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font:500 13px "IBM Plex Mono",monospace;display:grid;place-items:center}
.st b{display:block;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:36px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:13px;margin-top:6px}
.tr{position:relative;height:10px;background:var(--bg);border-radius:3px}
.tr i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.tr s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.agent{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.agent .top{background:var(--rail);color:#fff;padding:10px 16px;font-size:13px}
.agent .body{padding:18px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}.kv span:last-child{font-family:"IBM Plex Mono",monospace}
.try{background:var(--acc2);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px}
.try input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
.try label{display:flex;gap:8px;align-items:center;cursor:pointer}.try input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}
.ok{color:var(--grn)}.bad{color:var(--red)}
.muted{color:var(--mut);font-size:13px}
ol.rules{margin:0;padding-left:20px}ol.rules li{margin:8px 0}
[hidden]{display:none!important}
</style>

<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">Momentum</div>
    <a href="#start" data-p="start">Overview</a>
    <div class="gap"></div>
    <a href="#priya" data-p="priya">Priya</a>
    <a href="#dana" data-p="dana">Dana</a>
    <a href="#leo" data-p="leo">Leo</a>
    <a href="#marcus" data-p="marcus">Marcus</a>
    <div class="gap"></div>
    <a href="#summit" data-p="summit">Summit</a>
    <a href="#rules" data-p="rules">Rules</a>
  </nav>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>

<script>
/* Engine: same rules as the two-pager. Thresholds illustrative. */
const C={MIN:20,Z:2,X:2,ADV:1000,FULL:50000,CAPMAX:30000,CAPBASE:10000,ALLOW:400000};
const PEER={4:.86,7:.79,13:.72},W=[4,7,13],TIERS=["As-paid","Capped","Full"];
const pct=x=>Math.round(x*100)+"%",k$=x=>x>=1e6?"$"+(x/1e6).toFixed(1)+"M":"$"+Math.round(x/1e3)+"k";
const z0=()=>({4:0,7:0,13:0}),clone=o=>JSON.parse(JSON.stringify(o));
function engine(a,o){o=Object.assign({err:true,repl:true},o);const m={},p={};
  W.forEach(w=>{m[w]=a.m[w]-(o.err?a.e[w]:0);p[w]=a.p[w]+(o.repl?0:a.r[w]);});
  const cmp=W.filter(w=>m[w]>=C.MIN).map(w=>{const you=p[w]/m[w],yl=1-you,pl=1-PEER[w];return{w,you,yl,pl,z:(yl-pl)/Math.sqrt(pl*(1-pl)/m[w]),x:yl/pl};});
  let t,why;
  if(!cmp.length){t="Capped";why="Too few policies old enough to judge yet";}
  else{const sig=cmp.filter(c=>c.z>C.Z),ap=sig.filter(c=>c.w>=7&&c.x>=C.X);
    if(ap.length){t="As-paid";why=`Lapsing ${ap[0].x.toFixed(1)}× peers at ${ap[0].w} months`;}
    else if(sig.length){t="Capped";why="Clearly worse than peers, but under 2×";}
    else if(cmp.every(c=>c.yl<=c.pl)){t="Full";why="In line with peers";}
    else{t="stay";why="Within luck of peers";}}
  let tier;if(a.cur==="new")tier=t==="As-paid"?t:"Capped";
  else{const ci=TIERS.indexOf(a.cur);tier=t==="stay"?a.cur:(TIERS.indexOf(t)<ci?t:TIERS[Math.min(TIERS.indexOf(t),ci+1)]);}
  const gross=tier==="Full"?C.FULL:tier==="Capped"?Math.min(C.CAPMAX,C.CAPBASE+a.paid4*C.ADV):0;
  return{tier,why,gross,lim:Math.max(0,gross-a.debt),used:a.open*C.ADV,cmp,removed:o.err?a.e[4]+a.e[7]+a.e[13]:0};}

/* The case agents. Illustrative data. */
const S={
 priya:{name:"Priya",cur:"new",m:z0(),p:z0(),e:z0(),r:z0(),open:3,paid4:0,debt:1400,
  q:"Joined six weeks ago. Two of her first three policies have already lapsed.",
  why:"Three policies can't tell skill from luck. She keeps the advance at sale within a limit that grows as her customers pay."},
 dana:{name:"Dana",cur:"Full",m:{4:60,7:70,13:55},p:{4:44,7:55,13:41},e:{4:10,7:2,13:0},r:z0(),open:14,paid4:44,debt:0,
  q:"Solid two-year record. Her lapses spiked in the weeks Ethos charged customers on the wrong date.",
  why:"The lapses our billing caused come off her record and their clawbacks are refunded."},
 leo:{name:"Leo",cur:"Full",m:{4:400,7:300,13:150},p:{4:340,7:210,13:99},e:{4:3,7:2,13:1},r:{4:30,7:45,13:28},open:48,paid4:340,debt:0,
  q:"Many customers cancel and rebuy from him, earning him a fresh advance each time.",
  why:"Replacements that don't help the customer count as lapses for him. New replacements earn an advance only on extra premium."},
 marcus:{name:"Marcus",cur:"Full",m:{4:130,7:110,13:80},p:{4:101,7:73,13:40},e:{4:4,7:3,13:2},r:z0(),open:22,paid4:101,debt:18400,
  q:"Leads a large, productive Summit team. His own sales lapse often and he owes Ethos money.",
  why:"Clearly worse than peers but under 2×, so Capped, not As-paid. His debt cuts his limit. His team is judged one by one."}};
const st={pt:0,err:true,repl:true,mp:51,rec:0};

function priyaAt(t){const a=clone(S.priya);if(!t)return a;a.cur="Capped";const m4=t<3?0:3+4*(t-3);
  a.m={4:m4,7:0,13:0};a.p={4:m4?m4-2-Math.round((m4-3)*.05):0,7:0,13:0};a.paid4=a.p[4];a.open=Math.max(0,3+4*t-a.p[4]);a.debt=Math.max(0,1400-300*t);return a;}
const TRY={
 priya:{c:()=>`<span>Fast-forward</span><input type="range" min="0" max="9" value="${st.pt}" oninput="st.pt=+this.value;render()"><span class="mono">${st.pt?st.pt+" mo":"today"}</span>`,d:()=>priyaAt(st.pt)},
 dana:{c:()=>`<label><input type="checkbox" ${st.err?"checked":""} onchange="st.err=this.checked;render()">Remove lapses our billing caused</label>`,o:()=>({err:st.err})},
 leo:{c:()=>`<label><input type="checkbox" ${st.repl?"checked":""} onchange="st.repl=this.checked;render()">Count replacements that didn't help the customer</label>`,o:()=>({repl:st.repl})},
 marcus:{c:()=>`<span>His 13-month persistency</span><input type="range" min="30" max="80" value="${st.mp}" oninput="st.mp=+this.value;render()"><span class="mono">${st.mp}%</span><span class="muted">peers 72%</span>`,
  d:()=>{const a=clone(S.marcus);a.p[13]=Math.round((a.m[13]-a.e[13])*st.mp/100);return a;}}};

function agentView(a,r){const t=r.tier,line=t==="Full"?"Standard advance at sale.":t==="Capped"?"Advance at sale, up to your limit.":"Paid as your customers pay.";
  const up=t==="Full"?"Keep customers paying like your peers to stay here.":t==="Capped"?"Your limit grows as customers pay. Back in line with peers moves you to Full.":"Back in line with peers moves you to Capped.";
  return`<div class="agent"><div class="top">${a.name} · Agent portal</div><div class="body">
   <span><span class="tag big t-${t}">${t}</span></span><b>${line}</b>
   ${t==="As-paid"?"":`<div class="kv"><span>Limit</span><span>${k$(r.lim)}</span></div><div class="bar"><i style="width:${r.lim?Math.min(100,r.used/r.lim*100):100}%"></i></div>`}
   <div class="muted">${up}</div>${r.removed?`<div class="muted ok">✓ ${r.removed} lapses we caused removed</div>`:""}</div></div>`;}

function agentPage(k){const a=TRY[k].d?TRY[k].d():S[k],r=engine(a,TRY[k].o?TRY[k].o():{});
  const cmp=r.cmp.length?r.cmp.map(c=>{const bad=c.z>C.Z;return`<div class="cmp"><span class="mono">${c.w}M</span><span class="tr"><i style="width:${c.you*100}%;background:${bad?"var(--red)":"var(--grn)"}"></i><s style="left:${PEER[c.w]*100}%"></s></span><span class="mono ${bad?"bad":""}">${pct(c.you)}</span></div>`;}).join(""):`<div class="muted">Nothing old enough to compare yet</div>`;
  return`<h2>${a.name}</h2><div class="quote">${S[k].q}</div>
  <div class="try">${TRY[k].c()}</div>
  <div class="cols"><div class="card"><div class="lab">Engine</div><div class="steps">
    <div class="st"><span class="n">1</span><div><b>Correct billing errors</b><span class="muted">${r.removed?r.removed+" lapses removed":"none found"}</span></div></div>
    <div class="st"><span class="n">2</span><div><b>Compare with peers</b><span class="muted">Share still paying · tick = peers</span>${cmp}</div></div>
    <div class="st"><span class="n">3</span><div><b>Set tier</b><span class="tag t-${r.tier}">${r.tier}</span> <span class="muted">${r.why}</span></div></div></div></div>
   <div><div class="lab">What ${a.name} sees</div>${agentView(a,r)}</div></div>
  <p class="sub">${S[k].why}</p>${nav(k)}`;}

const ORDER=["start","priya","dana","leo","marcus","summit","rules"],NAME={start:"Overview",priya:"Priya",dana:"Dana",leo:"Leo",marcus:"Marcus",summit:"Summit",rules:"Rules"};
function nav(p){const i=ORDER.indexOf(p),a=ORDER[i-1],b=ORDER[i+1];return`<div class="nav">${a?`<button onclick="go('${a}')">← ${NAME[a]}</button>`:"<span></span>"}${b?`<button class="pri" onclick="go('${b}')">${NAME[b]} →</button>`:""}</div>`;}

function startPage(){return`<h1>Each agent's advance follows how their customers pay.</h1>
  <p class="sub">One rulebook for every agent. Ethos runs the check; agents see only their tier.</p>
  <div class="three"><div class="tier f"><b>FULL</b><p>Advance at sale. In line with peers.</p></div>
   <div class="tier c"><b>CAPPED</b><p>Advance at sale, up to a limit. New, or clearly worse than peers.</p></div>
   <div class="tier a"><b>AS-PAID</b><p>Paid as customers pay. 2× peer lapses or worse.</p></div></div>
  <div class="card"><div class="steps">
   <div class="st"><span class="n">1</span><div><b>Correct billing errors</b><span class="muted">Lapses we caused never count against an agent.</span></div></div>
   <div class="st"><span class="n">2</span><div><b>Compare with peers</b><span class="muted">Persistency at 4, 7 and 13 months vs agents with similar customers.</span></div></div>
   <div class="st"><span class="n">3</span><div><b>Set tier</b><span class="muted">Down only on a gap too big to be luck. Up once back in line.</span></div></div></div></div>
  <div class="nav"><span></span><button class="pri" onclick="go('priya')">See the four agents →</button></div>`;}

function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function mk(R,isNew){if(isNew)return{cur:"new",m:z0(),p:z0(),e:z0(),r:z0(),open:3+Math.floor(R()*12),paid4:0,debt:R()<.4?Math.round(R()*2500):0};
  const q=R(),sk=q<.05?-.2:q<.2?-.06:q<.65?0:.08,m={4:20+Math.floor(R()*60)};m[7]=Math.floor(m[4]*.75);m[13]=Math.floor(m[4]*.45);const p={},e={};
  W.forEach(w=>{e[w]=Math.floor(m[w]*.14*R());p[w]=Math.round((m[w]-e[w])*Math.min(.98,PEER[w]+sk*w/7));});
  return{cur:"Full",m,p,e,r:z0(),open:8+Math.floor(R()*24),paid4:p[4],debt:R()<.5?Math.round(R()*6000):0};}
function summitPage(){const R=rng(7),ro=[];for(let i=0;i<420+st.rec;i++)ro.push(mk(R,i<300||i>=420));
  const n={Full:0,Capped:0,"As-paid":0};let exp=0,book=0,debt=0;
  ro.forEach(a=>{const r=engine(a);n[r.tier]++;exp+=r.tier==="As-paid"?0:Math.min(r.used,r.lim);book+=a.paid4;debt+=a.debt;});
  const ceil=book*C.ADV+C.ALLOW-debt,over=exp>ceil;
  return`<h2>Summit</h2><div class="quote">Fast-growing agency, mostly new agents. Same rules as everyone, plus an agency ceiling.</div>
  <div class="try"><span>New recruits</span><input type="range" min="0" max="500" step="10" value="${st.rec}" oninput="st.rec=+this.value;render()"><span class="mono">${st.rec}</span></div>
  <div class="cols"><div class="card"><div class="lab">Agency ceiling</div>
    <div class="kv"><span>Advances outstanding</span><span>${k$(exp)}</span></div>
    <div class="kv"><span>Ceiling (backed by paying customers)</span><span>${k$(ceil)}</span></div>
    <div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,exp/ceil*100)}%;background:${over?"var(--red)":"var(--acc)"}"></i></div>
    <div class="${over?"bad":"ok"}">${over?"Over the ceiling: new sales are paid as customers pay until payments lift it.":"Under the ceiling: each agent gets their own tier's advance."}</div></div>
   <div class="card"><div class="lab">${ro.length} agents</div>
    <div class="kv"><span><span class="tag t-Full">Full</span></span><span>${n.Full}</span></div>
    <div class="kv" style="margin:8px 0"><span><span class="tag t-Capped">Capped</span></span><span>${n.Capped}</span></div>
    <div class="kv"><span><span class="tag t-As-paid">As-paid</span></span><span>${n["As-paid"]}</span></div></div></div>
  <p class="sub">Recruiting faster than customers pay hits the ceiling. Nobody's tier changes; only new advances wait.</p>${nav("summit")}`;}

function rulesPage(){return`<h2>Rules</h2><div class="card"><ol class="rules">
  <li>Lapses our billing caused are removed; clawbacks refunded.</li>
  <li>Persistency at 4, 7, 13 months vs similar customers, once ${C.MIN}+ policies are that old.</li>
  <li>Gap too big to be luck → Capped. 2× peer lapses at 7 or 13 months → As-paid.</li>
  <li>Back in line with peers → up one tier.</li>
  <li>Limits in dollars; unpaid debt is subtracted.</li>
  <li>Replacements earn an advance only on extra premium.</li>
  <li>Agency ceiling: advances can't outrun paying customers.</li></ol></div>
  <p class="muted">All data and thresholds illustrative.</p>${nav("rules")}`;}

let page="start";
function render(){document.getElementById("page").innerHTML=page==="start"?startPage():TRY[page]?agentPage(page):page==="summit"?summitPage():rulesPage();
  document.querySelectorAll("#rail a").forEach(a=>a.classList.toggle("on",a.dataset.p===page));}
function go(p){location.hash=p;}
function fromHash(){const h=location.hash.slice(1);page=ORDER.includes(h)?h:"start";render();window.scrollTo(0,0);}
window.addEventListener("hashchange",fromHash);fromHash();
</script>

</html>
